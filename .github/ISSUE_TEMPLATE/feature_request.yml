name: 功能建议
description: 建议一个功能或改进
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        提交前请先搜索现有 Issues，避免重复。
        OpenUsageCN 聚焦 AI 编程工具用量追踪，超出范围的需求可能会被关闭。
  - type: textarea
    id: problem
    attributes:
      label: 问题
      description: 这个功能想解决什么问题？现在哪里不方便？
      placeholder: 我希望 ...
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 建议方案
      description: 你希望它如何工作？
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 其他方案
      description: 是否考虑过其他做法？为什么这个方案更合适？
  - type: textarea
    id: additional
    attributes:
      label: 补充信息
      description: 截图、草图、链接或其他有助于理解的信息。
