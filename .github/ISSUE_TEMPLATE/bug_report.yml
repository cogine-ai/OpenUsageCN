name: 问题反馈
description: 反馈 OpenUsageCN 的问题
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请尽量补充复现步骤、版本和日志，方便维护者定位问题。
  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 发生了什么？
      placeholder: 简要说明你遇到的问题。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 我们应该如何复现？
      placeholder: |
        1. 打开 OpenUsageCN
        2. 进入 ...
        3. 点击 ...
        4. 看到错误 ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
      description: 你原本预期会发生什么？
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
      description: 实际发生了什么？
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: OpenUsageCN 版本
      description: 你正在使用哪个版本？可以在设置或关于里查看。
      placeholder: "例如 0.6.27"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: 操作系统
      options:
        - macOS (Apple Silicon)
        - macOS (Intel)
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: 截图
      description: 如果方便，请拖入或粘贴截图。
  - type: textarea
    id: additional
    attributes:
      label: 补充信息
      description: 其他可能有帮助的信息。
