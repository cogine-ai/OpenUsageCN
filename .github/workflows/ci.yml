name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Lint, Type-check, Build, Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.6"

      - run: bun install

      - name: Test Cookie Helper
        run: bun run test:cookie-helper

      - name: Type-check and build
        run: bun run build

      - name: Run tests
        run: bun run test

      - name: Test updater signature script
        run: node --test scripts/verify-updater-signature.test.mjs

  windows:
    name: Windows Build And NSIS
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.6"

      - run: bun install

      - name: Bundle plugins
        run: bun run bundle:plugins

      - name: Run tests
        run: bun run test --run

      - name: Type-check and build frontend
        run: bun run build

      - name: Test Rust library
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib

      - name: Check Windows binaries
        run: cargo check --manifest-path src-tauri/Cargo.toml --target x86_64-pc-windows-msvc --bins

      - name: Build unsigned NSIS installer
        run: >-
          bun tauri build
          --target x86_64-pc-windows-msvc
          --bundles nsis
          --config '{"bundle":{"createUpdaterArtifacts":false}}'
          --ci
