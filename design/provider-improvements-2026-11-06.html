<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Existing Provider Improvements</title>
<style>
:root{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color-scheme:dark;--background:#1c1c1e;--foreground:#ededed;--muted:#888;--surface:#242426;--border:#343438;--bar:#ededed;--warning:#f59e0b;--danger:#f87171}body.light{color-scheme:light;--background:#fff;--foreground:#111827;--muted:#6b7280;--surface:#f8f9fa;--border:#e5e7eb;--bar:#111827;--warning:#b45309;--danger:#dc2626}*{box-sizing:border-box}body{margin:0;background:var(--surface);color:var(--foreground);font-size:14px}.tools{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:16px;max-width:940px;margin:auto}.tools label{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}select,button{font:inherit;border:1px solid var(--border);border-radius:6px;background:var(--background);color:var(--foreground);padding:7px 9px}button{cursor:pointer}button:focus-visible,select:focus-visible{outline:2px solid var(--foreground);outline-offset:2px}.notice{max-width:940px;margin:0 auto 16px;padding:0 16px;color:var(--muted);font-size:12px;line-height:1.6}.panel{width:400px;height:500px;overflow:auto;margin:0 auto 24px;background:var(--background);padding:16px}.app{color:var(--muted);font-size:12px;border-bottom:1px solid var(--border);padding-bottom:12px;margin-bottom:28px}.head{display:flex;align-items:center;gap:8px;margin-bottom:22px}h1{font-size:18px;font-weight:600;letter-spacing:-.2px;margin:0}.plan{margin-left:auto;border:1px solid var(--border);border-radius:5px;padding:2px 6px;font-size:10px;color:var(--muted)}.account{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border);padding-bottom:12px;margin-top:-8px;margin-bottom:20px;color:var(--muted);font-size:12px}.metric{margin-bottom:24px;min-width:0}.metric h2{font-size:14px;font-weight:500;margin:0 0 6px;overflow-wrap:anywhere}.track{height:12px;background:var(--border);border-radius:99px;overflow:hidden}.fill{height:100%;background:var(--bar)}.amounts{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;margin-top:6px}.exhausted{color:var(--danger);font-size:12px;margin-top:4px;text-align:right}.row{display:flex;justify-content:space-between;gap:8px;font-size:12px;line-height:1.5;color:var(--muted);margin-bottom:8px;min-width:0}.row .label{min-width:0;flex:1}.row .value{max-width:65%;text-align:right;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}.subtitle{text-align:right;font-size:10px;color:var(--muted);line-height:1.5;margin-top:-5px;margin-bottom:10px;overflow-wrap:anywhere}.rule{border:0;border-top:1px solid var(--border);margin:20px 0}.unavailable{color:var(--warning)}.foot{font-size:10px;color:var(--muted);margin-top:20px}.error{border:1px solid #f59e0b66;background:#f59e0b0d;border-radius:10px;padding:16px}.error h2{font-size:14px;margin:0 0 10px}.error p{font-size:12px;line-height:1.6;color:var(--muted)}.error button{width:100%;margin-top:8px;background:var(--bar);color:var(--background);font-weight:500;height:40px}.badge{display:inline-block;border:1px solid var(--border);border-radius:4px;padding:0 6px;font-size:10px;color:var(--foreground)}
</style></head><body>
<div class="tools"><label>Provider <select id="provider"><option value="cursor">Cursor</option><option value="claude">Claude</option><option value="synthetic">Synthetic</option><option value="kiro">Kiro</option><option value="zai">Z.ai</option></select></label><label>State <select id="state"><option value="ready">Ready</option><option value="partial">Partial</option><option value="zero">Zero</option><option value="expired">Expired</option></select></label><label>Currency <select id="currency"><option>JPY</option><option>BHD</option><option>USD</option></select></label><label>Width <select id="width"><option>400</option><option>320</option></select></label><button id="theme">Light Mode</button></div>
<p class="notice">设计演示 · 所有额度和账号均为合成数据；控件只切换原型。第六组 HMAC Keychain 总超时沿用现有错误入口，没有新增界面。</p><main class="panel" id="panel" aria-live="polite"></main>
<script>
const $=id=>document.getElementById(id),q=new URLSearchParams(location.search);for(const id of ['provider','state','currency','width'])if(q.has(id))$(id).value=q.get(id);let light=q.has('light');const names={cursor:'Cursor',claude:'Claude',synthetic:'Synthetic',kiro:'Kiro',zai:'Z.ai'};
const row=(label,value,subtitle='',bad=false)=>`<div class="row"><span class="label">${label}</span><span class="value ${bad?'unavailable':''}">${value}</span></div>${subtitle?`<div class="subtitle">${subtitle}</div>`:''}`;
function progress(label,used,limit,kind='percent'){const amount=n=>kind==='percent'?`${n}%`:kind==='dollars'?`$${n.toFixed(2)}`:`${n} ${kind}`;return `<section class="metric"><h2>${label}</h2><div class="track" role="progressbar" aria-label="${label}" aria-valuenow="${used}" aria-valuemax="${limit}"><div class="fill" style="width:${Math.max(0,Math.min(100,used/limit*100))}%"></div></div><div class="amounts"><span>已用 ${amount(used)}</span><span>${amount(limit)} 上限</span></div>${used>=limit?'<div class="exhausted">已达上限</div>':''}</section>`}
function render(){document.body.classList.toggle('light',light);$('theme').textContent=light?'Dark Mode':'Light Mode';$('panel').style.width=$('width').value+'px';const id=$('provider').value,s=$('state').value,z=s==='zero',partial=s==='partial';let html=`<div class="app">OpenUsageCN</div><header class="head"><h1>${names[id]}</h1><span class="plan">${id==='cursor'?'Pro+':id==='claude'?'Pro':id==='kiro'?'Pro':'Usage'}</span></header>`;
if(s==='expired'){html+='<section class="error"><h2>需要更新连接</h2><p>'+({cursor:'在 Cursor 中登录，然后重新检查当前账号。',claude:'在 Claude Code 中完成登录，然后检查本机连接。',synthetic:'更新 Synthetic API Key，然后重新检查。',kiro:'在当前使用的 Kiro CLI 或应用中重新登录，然后检查连接。',zai:'在设置中更新 Z.ai API Key，然后检查连接。'}[id])+'</p><button id="recover">'+(['cursor','claude','kiro'].includes(id)?'检查本机登录':'更新凭据')+'</button></section>';}
else if(id==='cursor'){html+='<div class="account"><span>账号 · 工作账号</span><span>当前选中</span></div>'+progress('Shared Weekly Usage',z?0:36,100)+'<hr class="rule">'+(partial?row('On-Demand','Unavailable','月度额外消费',true):progress('On-Demand',z?0:12,50,'dollars'))+row('Scope','Current User')+row('Billing Period','Monthly')+row('Model Usage','独立查看历史记录','不与历史计费金额相加');}
else if(id==='claude'){html+=progress('Session',z?0:25,100)+progress('Weekly',z?0:40,100)+progress('Fable Weekly',z?0:18,100)+(partial?row('Sonnet Weekly','Unavailable','仅该模型额度不可用',true):progress('Sonnet Weekly',z?0:12,100));const c=$('currency').value;html+='<hr class="rule">';if(c==='USD')html+=progress('Extra Usage Spent',z?0:5,100,'dollars');else html+=row('Extra Spent',c==='JPY'?`JPY ${z?'0':'500'}`:`BHD ${z?'0.000':'1.234'}`)+row('Extra Limit',c==='JPY'?'JPY 1,000':'BHD 10.000');}
else if(id==='synthetic'){html+=progress('Weekly',z?0:60,100)+'<hr class="rule">'+row('Next Regen',partial?'Unavailable':'2026-11-07 00:30 UTC+08:00','再生时间，不是完全重置',partial)+row('Regen Percent',partial?'Unavailable':'2%','仅展示服务端再生百分比',partial)+row('Search',z?'0 / 250 requests':'18 / 250 requests');}
else if(id==='kiro'){html+=(partial?row('Credits','Unavailable','CLI 合计含奖励，无法可靠拆分套餐池',true):progress('Credits',z?0:100,100,'credits'))+progress('Overage Credits',z?0:20,50,'credits')+progress('Bonus Credits',z?0:5,10,'credits')+row('Overages','<span class="badge">Enabled</span>')+row('Scope','Separate Credit Pools','套餐、超额和奖励分别计量');}
else if(id==='zai'){html+=progress('Session',z?0:65,100)+progress('Weekly',z?0:40,100)+'<hr class="rule">'+row('5h Reset Coupons',partial?'Unavailable':z?'0':'3','',partial)+row('Weekly Reset Coupons',partial?'Unavailable':z?'0':'1','',partial)+row('Coupon Expiry',partial?'Unavailable':z?'None':'2026-11-07 00:30',partial?'券到期，不是额度重置':z?'没有未过期券':'UTC+08:00 · 券到期，不是额度重置',partial);}
html+='<p class="foot">'+(s==='expired'?'尚未完成新的连接检查':'上次更新 21:45 · 当前连接')+'</p>';$('panel').innerHTML=html;const recover=$('recover');if(recover)recover.onclick=()=>{$('state').value='ready';render()};}
for(const id of ['provider','state','currency','width'])$(id).addEventListener('change',render);$('theme').onclick=()=>{light=!light;render()};render();
</script></body></html>
