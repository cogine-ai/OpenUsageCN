<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>New Provider Connections</title>
<style>
:root{font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color-scheme:dark;--background:#1c1c1e;--foreground:#ededed;--muted:#2a2a2c;--muted-foreground:#929296;--border:rgba(255,255,255,.09);--primary:#ededed;--primary-foreground:#151515;--positive:#bfff00;--warning:#f4b763;--error:#ef7878;--input:#19191b;--panel-width:400px}*{box-sizing:border-box}body{margin:0;background:#111114;color:var(--foreground);-webkit-font-smoothing:antialiased}body.light{color-scheme:light;--background:#fff;--foreground:#171b23;--muted:#f3f4f6;--muted-foreground:#676d77;--border:rgba(17,24,39,.11);--primary:#202532;--primary-foreground:#fff;--positive:#288b51;--warning:#976518;--error:#bc3d3d;--input:#fafafb;background:#e9ebef}button,input,select{font:inherit}button{cursor:pointer;color:inherit}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--muted-foreground);outline-offset:3px}button:disabled{cursor:wait;opacity:.55}button:active:not(:disabled){transform:scale(.98)}button{transition:background .12s,opacity .12s}a{color:inherit}.toolbar{margin:24px auto 20px;max-width:760px;padding:0 16px;display:flex;gap:12px;align-items:end;flex-wrap:wrap}.toolbar label{display:grid;gap:4px;font-size:11px;color:var(--muted-foreground)}.toolbar strong{display:block;flex-basis:100%;font-size:14px;color:var(--foreground)}.toolbar select,.toolbar button{height:32px;border:1px solid var(--border);border-radius:6px;background:var(--background);padding:0 10px;color:var(--foreground)}.preview{display:flex;justify-content:center;padding:0 12px 32px}.panel{width:min(var(--panel-width),100%);height:500px;display:flex;flex-direction:column;background:var(--background);border-radius:12px;overflow:hidden;box-shadow:0 0 0 1px var(--border),0 16px 56px #0003}.appbar{height:42px;padding:10px 16px;display:flex;align-items:center;gap:16px;border-bottom:1px solid var(--border);flex:none}.brand{font-size:13px;font-weight:650;flex:1}.text-button{background:transparent;border:0;padding:4px 0;font-size:11px;color:var(--muted-foreground)}.text-button:hover{color:var(--foreground)}main{padding:16px;overflow:auto;min-height:0;flex:1}.page-header{display:flex;gap:10px;align-items:center;margin-bottom:20px}.page-header h1{font-size:16px;line-height:1.3;font-weight:650;margin:0;flex:1;min-width:0}.back{background:transparent;border:0;padding:2px 0;font-size:11px;color:var(--muted-foreground)}.summary{font-size:12px;color:var(--muted-foreground);margin:-4px 0 20px;line-height:1.6}.fields{display:grid;gap:16px}.field label{display:block;font-size:12px;font-weight:550;margin-bottom:8px}.field input{width:100%;min-width:0;height:38px;border-radius:6px;background:var(--input);border:1px solid var(--border);color:var(--foreground);padding:8px 10px;font-size:12px}.field input::placeholder{color:var(--muted-foreground)}.segments{display:flex;gap:8px}.segments button{flex:1;min-width:0;height:36px;border:1px solid var(--border);background:var(--background);border-radius:6px;font-size:12px}.segments .selected{background:var(--primary);color:var(--primary-foreground);border-color:var(--primary)}.advanced{margin-top:18px;border-top:1px solid var(--border);padding:12px 0 0;font-size:11px;color:var(--muted-foreground)}.advanced summary{cursor:pointer}.advanced p{margin:10px 0 0;line-height:1.65;overflow-wrap:anywhere}.actions{margin-top:16px;padding-top:14px;border-top:1px solid var(--border);display:grid;gap:10px}.button{height:40px;border-radius:7px;border:1px solid var(--border);background:transparent;padding:0 12px;font-size:12px;font-weight:550;min-width:0}.button.primary{background:var(--primary);color:var(--primary-foreground);border-color:var(--primary)}.button:hover{background:var(--muted)}.button.primary:hover{opacity:.9}.status{font-size:11px;line-height:1.55;color:var(--muted-foreground);margin:0}.status.ready{color:var(--positive)}.status.error{color:var(--error)}.status.warning{color:var(--warning)}.footer{height:34px;padding:8px 16px;border-top:1px solid var(--border);font-size:10px;color:var(--muted-foreground);flex:none}.provider-list{display:grid;gap:0}.provider-row{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--border)}.mark{width:26px;height:26px;display:grid;place-items:center;border-radius:7px;background:var(--muted);font-size:10px;font-weight:700;color:var(--muted-foreground)}.provider-name{flex:1;min-width:0;font-size:12px;font-weight:550}.provider-name small{display:block;font-size:10px;font-weight:400;color:var(--muted-foreground);margin-top:2px}.provider-row button{font-size:11px;background:transparent;border:1px solid var(--border);border-radius:6px;height:30px;padding:0 10px}.provider-row input{accent-color:var(--positive);margin:0 0 0 4px}.name-heading{font-size:19px;line-height:1.3;margin:0 0 4px;font-weight:650}.plan{font-size:11px;color:var(--muted-foreground);margin:0 0 20px}.metric{padding:12px 0;border-top:1px solid var(--border)}.metric:first-child{border-top:0;padding-top:0}.metric-top{display:flex;gap:12px;justify-content:space-between;align-items:baseline}.metric label{font-size:12px;color:var(--muted-foreground)}.metric strong{font-size:18px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}.metric.small strong{font-size:14px}.bar{height:5px;margin-top:9px;background:var(--muted);border-radius:8px;overflow:hidden}.bar span{display:block;height:100%;background:var(--foreground);opacity:.78;border-radius:8px}.metric p{margin:6px 0 0;font-size:10px;color:var(--muted-foreground);line-height:1.6}.notice{border:1px solid var(--border);background:var(--muted);border-radius:8px;padding:12px;margin-bottom:16px;font-size:11px;color:var(--warning);line-height:1.6}.device{padding:16px;border:1px solid var(--border);border-radius:10px;background:var(--muted)}.device .eyebrow{font-size:11px;color:var(--muted-foreground);margin:0 0 8px}.code{font-size:26px;font-weight:650;letter-spacing:.12em;margin:0 0 12px;font-variant-numeric:tabular-nums;user-select:all;overflow-wrap:anywhere}.device .button{width:100%;margin-bottom:8px}.device .button:last-child{margin-bottom:0}.device p:last-child{margin-bottom:0}.device-step{display:flex;gap:10px;margin:12px 0;font-size:12px}.device-step span:first-child{font-size:11px;border:1px solid var(--border);border-radius:50%;width:20px;height:20px;display:grid;place-items:center;flex:none}.skeleton{height:12px;background:var(--muted);border-radius:4px;margin:14px 0;width:78%}.skeleton.short{width:50%}.empty{text-align:center;padding:24px 12px;font-size:12px;color:var(--muted-foreground)}@media(prefers-reduced-motion:reduce){button{transition:none;transform:none!important}}@media(max-width:360px){.toolbar{margin-top:12px;gap:8px}.toolbar select{max-width:145px}.preview{padding-left:8px;padding-right:8px}.metric strong{font-size:16px}}
</style></head><body>
<div class="toolbar"><strong>新服务商接入 · 交互设计稿 · 合成数据</strong><label>Provider<select id="provider"></select></label><label>Screen<select id="screen"><option value="connect">连接</option><option value="detail">详情</option><option value="catalog">服务商选择</option></select></label><label>State<select id="state"><option value="missing">Missing</option><option value="checking">Checking</option><option value="ready">Ready</option><option value="partial">Partial</option><option value="expired">Expired</option><option value="error">Error</option><option value="empty">Empty</option></select></label><button id="theme">浅色</button><label>Width<select id="width"><option value="400">400px</option><option value="320">320px</option></select></label></div>
<div class="preview"><section class="panel"><header class="appbar"><span class="brand">OpenUsageCN</span><button class="text-button" id="home">总览</button><button class="text-button" id="settings">设置</button></header><main id="content"></main><footer class="footer">用量按服务商分别显示</footer></section></div>
<script>
const providers={
 'claude-platform':{name:'Claude Platform',mark:'CP',source:'当前 API 组织',summary:'查看 Anthropic Console 的 API 余额和消费。Claude Code 订阅额度仍在 Claude 中单独查看。',fields:[['Session Cookie','secret','输入包含 sessionKey 的 Cookie'],['Organization ID','secret','可选：仅一个 API 组织时自动识别']],help:'从已登录 Console 的有效请求复制 Cookie。有多个 API 组织时填写 Organization ID；连接不会在组织间自动切换。',metrics:[['Prepaid Balance','$28.50','当前 API 组织'],['Subscription Credit','$12.00','订阅赠送部分，已包含在余额中'],['Purchased Credit','$16.50','购买部分，已包含在余额中'],['This Month Spend','$8.24','本月 · UTC']]},
 workbuddy:{name:'WorkBuddy',mark:'W',source:'当前会话',summary:'查看当前 WorkBuddy 账号的套餐 Credits 与奖励部分。',fields:[['Session Cookie','secret','输入账单请求的 Cookie'],['User-Agent','text','输入同一请求的 User-Agent']],help:'Cookie 与 User-Agent 需来自同一次已登录账单请求。Rewards 是总 Credits 的奖励部分，不与总额相加。当前只读取账单摘要，不推测到期和重置。',metrics:[['Available Credits','4,800','总额 6,000 · 预留 200'],['Rewards','800','奖励部分，已包含在总 Credits 中']]},
 'trae-cn':{name:'Trae CN',mark:'T',source:'当前会话',summary:'查看 Trae 中国站当前套餐的 Usage 与 Credits。不同额度池分别展示。',fields:[['Session Cookie','secret','输入 Trae 中国站请求的 Cookie']],help:'使用 api.trae.cn 当前登录会话的 Cookie。短期令牌仅在请求中使用；未返回重置时间时不推测周期。',metrics:[['Usage','35%','当前套餐',35],['Credits','650 / 1,000','已用 350 · 当前额度池',35]]},
 litellm:{name:'LiteLLM',mark:'L',source:'当前虚拟 Key',summary:'查看虚拟 Key 对应的预算和消费。个人、成员和团队范围分别显示。',fields:[['Proxy URL','text','https://proxy.example.com'],['Virtual API Key','secret','输入虚拟 Key']],help:'使用自己的虚拟 Key。Personal、Team Member 和 Team 是不同统计范围，不计算合计。无预算时仅展示 Spending，不表示无限额度。',metrics:[['Personal Budget','$12.50 / $50','已用 · 当前用户',25],['Team Member Budget','$8.00 / $30','已用 · 当前成员',27],['Team Budget','$240 / $500','已用 · 当前团队',48]]},
 siliconflow:{name:'SiliconFlow',mark:'S',source:'中国站 · CNY',summary:'查看余额、充值和赠送金额，保留服务端返回的原币种。',fields:[['Region','region',''],['API Key','secret','输入 SiliconFlow API Key']],help:'中国站使用 CNY，国际站使用 USD。两个地区的 Key 和余额分别读取；不进行币种换算，负余额也会保留。',metrics:[['Balance','¥42.80','中国站 · CNY'],['Purchased','¥30.00','充值部分'],['Bonus','¥12.80','赠送部分']]},
 muse:{name:'Muse Code',mark:'M',source:'Meta 授权连接',summary:'在 Meta 授权页面输入验证码，连接 Muse Code 用量。',fields:[],help:'授权只在 Meta 页面完成。OpenUsageCN 验证当前用量成功后保存连接；取消或过期不会覆盖原有连接。',metrics:[['Session','72%','剩余 · 2小时后重置',28],['Weekly','81%','剩余 · 周日重置',19]]}
};
let provider='claude-platform',screen='connect',state='missing',region='china';const query=new URLSearchParams(location.search);if(providers[query.get('provider')])provider=query.get('provider');if(['connect','detail','catalog'].includes(query.get('screen')))screen=query.get('screen');if(['missing','checking','ready','partial','expired','error','empty'].includes(query.get('state')))state=query.get('state');if(query.get('width')==='320')document.documentElement.style.setProperty('--panel-width','320px');if(query.has('light'))document.body.classList.add('light');
const content=document.querySelector('#content');
const providerSelect=document.querySelector('#provider');for(const [id,p]of Object.entries(providers)){const o=document.createElement('option');o.value=id;o.textContent=p.name;providerSelect.append(o)}
function statusText(){return state==='ready'?'连接成功':state==='checking'?'已保存 · 正在检查连接':state==='partial'?'连接可用 · 部分消费明细暂不可用':state==='expired'?'登录已过期，请重新连接。':state==='error'?'连接暂不可用，请检查凭据和访问权限后重试。':state==='empty'?'连接可用 · 暂无用量记录':'尚未连接'}
function update(){document.querySelector('#provider').value=provider;document.querySelector('#screen').value=screen;document.querySelector('#state').value=state;const p=providers[provider];let html='';
 if(screen==='catalog'){html='<div class="page-header"><h1>服务商</h1></div><p class="summary">选择需要查看用量的服务商。</p><div class="provider-list">'+Object.entries(providers).map(([id,x])=>'<div class="provider-row"><span class="mark">'+x.mark+'</span><span class="provider-name">'+x.name+'<small>'+x.source+'</small></span><button data-connect="'+id+'">连接</button><input type="checkbox" aria-label="启用 '+x.name+'"></div>').join('')+'</div>';}
 else if(screen==='connect'){html='<div class="page-header"><button class="back" data-screen="detail">返回</button><h1>'+p.name+' · 连接</h1></div><p class="summary">'+p.summary+'</p>';
 if(provider==='muse'){
 if(state==='checking'){html+='<div class="device"><p class="eyebrow">在 Meta 页面输入验证码</p><p class="code">FAKE-2468</p><button class="button" data-copy>复制验证码</button><button class="button primary" data-open>打开 Meta 授权网页</button><p class="status">等待授权 · 还有 9 分 42 秒</p></div><div class="actions"><button class="button" data-cancel>取消连接</button></div>';}
 else if(state==='ready'||state==='partial'||state==='empty'){html+='<div class="device"><p class="status ready">Meta 连接已验证</p><p class="summary" style="margin:8px 0 0">当前授权已可读取 Muse Code 用量。</p></div><div class="actions"><button class="button primary" data-save>重新连接</button><button class="button" data-screen="detail">查看用量</button></div>';}
 else{html+='<div class="device-step"><span>1</span><span>获取验证码并打开 Meta 授权网页。</span></div><div class="device-step"><span>2</span><span>完成授权后，等待用量检查。</span></div><div class="actions"><p role="status" class="status '+(state==='expired'?'warning':state==='error'?'error':'')+'">'+(state==='expired'?'验证码已过期，请重新获取。':statusText())+'</p><button class="button primary" data-save>'+(state==='missing'?'连接 Meta 账号':'重新连接')+'</button></div>';}
 }else{html+='<div class="fields">'+p.fields.map(([label,type,placeholder])=>'<div class="field"><label>'+label+'</label>'+(type==='region'?'<div class="segments"><button data-region="china" class="'+(region==='china'?'selected':'')+'">China</button><button data-region="international" class="'+(region==='international'?'selected':'')+'">International</button></div>':'<input aria-label="'+label+'" type="'+(type==='secret'?'password':'text')+'" placeholder="'+((state==='ready'||state==='partial')&&type==='secret'?'已保存 ••••demo':placeholder)+'" '+(state==='checking'?'disabled':'')+'>')+'</div>').join('')+'</div><details class="advanced"><summary>高级设置</summary><p>'+p.help+'</p></details><div class="actions"><p role="status" class="status '+(state==='ready'?'ready':state==='error'||state==='expired'?'error':state==='partial'?'warning':'')+'">'+statusText()+'</p><button class="button primary" data-save '+(state==='checking'?'disabled':'')+'>'+(state==='checking'?'正在检查连接':'保存并检查')+'</button>'+(['ready','partial','empty'].includes(state)?'<button class="button" data-screen="detail">查看用量</button>':'')+'</div>';}}
 else{html='<div class="page-header"><button class="back" data-screen="catalog">返回</button><h1>'+p.name+'</h1><button class="text-button" data-screen="connect">连接设置</button></div><h2 class="name-heading">'+p.name+'</h2><p class="plan">'+(provider==='siliconflow'?(region==='china'?'中国站 · CNY':'国际站 · USD'):p.source)+'</p>';
 if(state==='missing'){html+='<div class="notice">缺少连接凭据<div class="actions" style="margin-top:10px;padding-top:0;border:0"><button class="button primary" data-screen="connect">连接账号</button></div></div>';}
 else if(state==='checking'){html+='<p class="status">正在刷新用量</p><div class="skeleton"></div><div class="skeleton short"></div><div class="skeleton"></div>';}
 else if(state==='empty'){html+='<div class="empty">'+(provider==='muse'?'当前账号未提供额度':'暂无用量记录')+'</div>';}
 else{if(state==='partial'||state==='error'||state==='expired')html+='<div class="notice">'+(state==='partial'?'部分用量暂不可用；可用数据保留。':state==='expired'?'登录已过期。以下为上次成功读取的数据。':'刷新失败。以下为上次成功读取的数据。')+'</div>';
 html+=p.metrics.map(([label,value,note,pct],i)=>{if(state==='partial'&&provider==='claude-platform'&&i===3)return'<div class="metric small"><div class="metric-top"><label>'+label+'</label><strong>暂不可用</strong></div><p>余额仍可读取</p></div>';if(provider==='siliconflow'&&region==='international'){value=['$12.30','$10.00','$2.30'][i];note=note.replace('中国站 · CNY','国际站 · USD')}return'<div class="metric '+(i?'small':'')+'"><div class="metric-top"><label>'+label+'</label><strong>'+value+'</strong></div>'+(typeof pct==='number'?'<div class="bar"><span style="width:'+pct+'%"></span></div>':'')+'<p>'+note+'</p></div>'}).join('');html+='<div class="actions"><p class="status">'+(state==='error'||state==='expired'?'上次更新：15 分钟前':'刚刚更新')+'</p><button class="button" data-refresh>刷新用量</button></div>';}}
 content.innerHTML=html;
 content.querySelectorAll('[data-screen]').forEach(b=>b.onclick=()=>{screen=b.dataset.screen;update()});content.querySelectorAll('[data-connect]').forEach(b=>b.onclick=()=>{provider=b.dataset.connect;screen='connect';state='missing';update()});content.querySelectorAll('[data-region]').forEach(b=>b.onclick=()=>{region=b.dataset.region;update()});content.querySelectorAll('[data-save]').forEach(b=>b.onclick=()=>{state='checking';update();if(provider!=='muse')setTimeout(()=>{state='ready';update()},800)});content.querySelectorAll('[data-refresh]').forEach(b=>b.onclick=()=>{state='checking';update();setTimeout(()=>{state='ready';update()},800)});content.querySelectorAll('[data-cancel]').forEach(b=>b.onclick=()=>{state='missing';update()});content.querySelectorAll('[data-copy]').forEach(b=>b.onclick=()=>{b.textContent='已复制'});content.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{b.textContent='等待 Meta 授权完成'});
}
providerSelect.onchange=e=>{provider=e.target.value;update()};document.querySelector('#screen').onchange=e=>{screen=e.target.value;update()};document.querySelector('#state').onchange=e=>{state=e.target.value;update()};document.querySelector('#theme').onclick=()=>{document.body.classList.toggle('light');document.querySelector('#theme').textContent=document.body.classList.contains('light')?'深色':'浅色'};document.querySelector('#width').onchange=e=>document.documentElement.style.setProperty('--panel-width',e.target.value+'px');document.querySelector('#settings').onclick=()=>{screen='catalog';update()};document.querySelector('#home').onclick=()=>{screen='detail';state='ready';update()};update();
</script></body></html>
