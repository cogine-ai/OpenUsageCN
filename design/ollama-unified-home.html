<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ollama Cloud · Unified Accounts Design</title><style>
:root{color-scheme:light;--bg:#fff;--fg:#101828;--muted:#687385;--border:#e7e9ed;--surface:#f6f7f9;--bar:#17202f;--warning:#ad6800;font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--fg)}:root.dark{color-scheme:dark;--bg:#1c1c1e;--fg:#ededed;--muted:#9a9a9e;--border:#ffffff14;--surface:#252527;--bar:#ededed;--warning:#e9a23b}*{box-sizing:border-box}body{margin:0;-webkit-font-smoothing:antialiased}main{max-width:400px;padding:16px;margin:auto}.app{font-size:12px;color:var(--muted);padding-bottom:20px;border-bottom:1px solid var(--border)}header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:20px 0 12px}h1{font-size:20px;letter-spacing:-.35px;margin:0;font-weight:650}button{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--border);border-radius:6px;min-height:40px;padding:6px 10px;cursor:pointer}button:focus-visible{outline:2px solid var(--muted);outline-offset:2px}button:hover{background:var(--surface)}button:disabled{opacity:.5;cursor:default}.tools{display:flex;align-items:center;gap:8px;margin-bottom:12px}.muted{color:var(--muted);font-size:12px}.tools .muted{flex:1}.account{border:1px solid var(--border);border-radius:10px;padding:12px;margin:0 0 12px}.line{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}.name{font-weight:600}.badge{font-size:11px;background:var(--surface);padding:2px 6px;border-radius:4px;color:var(--muted)}.identity{font-size:12px;color:var(--muted);margin:4px 0 12px;overflow-wrap:anywhere}.metric{margin:10px 0}.value{font-size:14px;font-weight:600;font-variant-numeric:tabular-nums}.track{height:6px;border-radius:6px;background:var(--surface);margin:6px 0;overflow:hidden}.fill{height:100%;background:var(--bar)}footer{font-size:11px;color:var(--muted);border-top:1px solid var(--border);margin-top:12px;padding-top:8px}.footnote{font-size:12px;color:var(--muted);margin:16px 0}.warning{color:var(--warning);font-size:12px;margin:8px 0}.empty{text-align:center;padding:24px 12px}.account a{color:inherit;text-decoration:none}.meta{color:var(--muted);font-size:11px}h2{font-size:14px;margin:0}a:focus-visible{outline:2px solid var(--muted)}
</style></head><body><main><div class="app">OpenUsageCN　/　首页</div><header><h1>Ollama Cloud</h1><button id="manage">管理账号</button></header><div class="tools"><span class="muted" id="count">2 个连接</span><button id="refresh">刷新全部</button></div><div id="accounts"></div><p class="footnote">各连接用量分别展示，不计算合计。同一账号的多个 Key 可能共享额度。</p><p class="meta">主账号用于菜单栏和本地 API，不影响首页展示。</p></main><script>
const q=new URLSearchParams(location.search);if(q.has('dark'))document.documentElement.classList.add('dark');const empty=q.has('empty'),partial=q.has('partial'),legacy=q.has('legacy');
const accounts=[{name:'个人账号',identity:'alex-home · API Key',used:24,limit:60,credits:20,primary:true},{name:'工作账号',identity:'alex-work · API Key',used:68,limit:100,credits:12,failed:partial}];if(legacy)accounts.push({name:'原有连接',identity:'Cookie',used:12,limit:60,credits:8});
const panel=document.getElementById('accounts');const row=a=>`<article class="account"><div class="line"><h2 class="name"><a href="#${a.name}">${a.name}</a></h2><span class="badge">${a.primary?'主账号':'Pro'}</span></div><div class="identity">${a.identity}</div>${a.failed?'<p class="warning">本次未更新，保留上次成功用量。</p>':''}<div class="metric"><div class="line"><span class="muted">Monthly · 已用</span><span class="value">$${a.used} / $${a.limit}</span></div><div class="track"><div class="fill" style="width:${a.used/a.limit*100}%"></div></div><div class="line meta"><span>预计 14 天后用尽</span><span>25 天后重置</span></div></div><div class="line"><span class="muted">Purchased Credits</span><span class="value">$${a.credits}.00</span></div><footer class="line"><span>额度更新于 09:41</span><a href="#${a.name}">查看详情</a></footer></article>`;
panel.innerHTML=empty?'<div class="account empty"><h2>添加 Ollama Cloud 连接</h2><p class="muted">添加 API Key 或配置原有 Cookie 连接。</p><button>添加连接</button></div>':accounts.map(row).join('');document.getElementById('count').textContent=empty?'尚无已配置连接':accounts.length+' 个连接';document.getElementById('refresh').disabled=empty;document.getElementById('refresh').onclick=e=>{e.target.textContent='正在刷新…';e.target.disabled=true;setTimeout(()=>{e.target.textContent='刷新全部';e.target.disabled=false},600)};document.getElementById('manage').onclick=()=>{panel.innerHTML=accounts.map(a=>`<div class="account"><h2>${a.name}</h2><p class="identity">${a.identity}</p><button>修改连接</button>　<button>${a.primary?'当前主账号':'设为主账号'}</button></div>`).join('')+(legacy?'':'<div class="account"><h2>原有连接</h2><p class="identity">未配置 · Cookie / API Key / 环境变量</p><button>配置连接</button></div>')};
</script></body></html>
